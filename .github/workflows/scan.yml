name: Scan SF agendas

# Runs the agenda scanner in the cloud (no dependency on anyone's laptop) and
# publishes the refreshed site to the docs/ folder that GitHub Pages serves.

on:
  schedule:
    # 15:00 UTC = ~7-8 AM Pacific (shifts one hour with daylight saving),
    # on Mondays and Thursdays.
    - cron: '0 15 * * 1,4'
  workflow_dispatch:   # lets you run it on demand from the Actions tab

permissions:
  contents: write      # allow the job to commit the updated site back to the repo

env:
  TZ: America/Los_Angeles   # so the site's "Updated ..." time shows Pacific, not UTC

concurrency:
  group: agenda-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # backstop: never let a hung run drag on like the Aug 6 one
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run the agenda scan (retry on transient network hangs)
        run: |
          for attempt in 1 2 3; do
            echo "Scan attempt $attempt..."
            if timeout 300 python scan_agendas.py; then
              echo "Scan succeeded on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt failed or timed out; waiting 30s before retry."
            sleep 30
          done
          echo "All scan attempts failed."
          exit 1

      - name: Commit and publish the updated site
        run: |
          git config user.name "soma-agenda-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Agenda scan $(date -u +%Y-%m-%d)"
            git push
          fi
